<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe</title>
<meta name="author" content="Ashutosh Yadav" />
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #131a33;
    --panel: rgba(255, 255, 255, 0.04);
    --stroke: rgba(255, 255, 255, 0.10);
    --text: #e9ecf8;
    --muted: #8d97b8;
    --x: #38e1ff;
    --o: #ff5ca8;
    --win: #ffd166;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 600px at 15% -10%, #24305c 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 110%, #3a1d54 0%, transparent 55%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100%;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
  }

  header { text-align: center; margin-bottom: 20px; }

  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    letter-spacing: 0.06em;
    font-weight: 800;
    background: linear-gradient(92deg, var(--x), var(--o));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    padding: 16px;
    backdrop-filter: blur(8px);
  }

  /* ---------- status ---------- */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 34px;
    margin-bottom: 14px;
  }

  .status .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    font-size: 1.1rem;
    font-weight: 800;
    color: #08101f;
  }
  .status .mark.x { background: var(--x); box-shadow: 0 0 18px rgba(56, 225, 255, 0.45); }
  .status .mark.o { background: var(--o); box-shadow: 0 0 18px rgba(255, 92, 168, 0.45); }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
  }

  .cell {
    position: relative;
    border: 1px solid var(--stroke);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .cell:hover:not(.taken):not(.disabled) {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.22);
    transform: translateY(-2px);
  }

  .cell:active:not(.taken):not(.disabled) { transform: scale(0.96); }

  .cell:disabled { cursor: default; }

  .cell.x { color: var(--x); text-shadow: 0 0 22px rgba(56, 225, 255, 0.45); }
  .cell.o { color: var(--o); text-shadow: 0 0 22px rgba(255, 92, 168, 0.45); }

  .cell.taken { animation: pop 0.22s ease-out; }

  .cell.win {
    background: rgba(255, 209, 102, 0.14);
    border-color: var(--win);
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.35) inset;
    color: var(--win);
    text-shadow: 0 0 22px rgba(255, 209, 102, 0.5);
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.24); }
  button:active { transform: scale(0.97); }

  button.primary {
    flex: 1 1 100%;
    background: linear-gradient(92deg, var(--x), #6f7bff 55%, var(--o));
    border: none;
    color: #08101f;
    font-weight: 800;
    letter-spacing: 0.03em;
    padding: 12px 16px;
  }
  button.primary:hover { filter: brightness(1.08); }

  .seg {
    display: flex;
    flex: 1 1 100%;
    gap: 6px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 4px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 9px;
    padding: 8px 10px;
    color: var(--muted);
  }
  .seg button.active {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
  }

  select {
    font: inherit;
    color: var(--text);
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 9px 12px;
    cursor: pointer;
  }
  select option { background: #131a33; color: var(--text); }

  /* ---------- scoreboard ---------- */
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }

  .score {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
  }
  .score .label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .score .value { font-size: 1.5rem; font-weight: 800; margin-top: 2px; }
  .score.x .value { color: var(--x); }
  .score.o .value { color: var(--o); }
  .score.d .value { color: var(--muted); }

  .hint { margin-top: 12px; text-align: center; color: var(--muted); font-size: 0.8rem; }

  .credit {
    margin: 20px 0 4px;
    text-align: center;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .credit strong {
    color: var(--text);
    font-weight: 700;
  }

  @media (max-width: 380px) {
    .panel { padding: 12px; }
    .board { gap: 8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Three in a row wins.</p>
    </header>

    <div class="panel">
      <div class="status" id="status" aria-live="polite"></div>

      <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>

      <div class="controls">
        <button class="primary" id="newGame">New Game</button>

        <div class="seg" id="modeSeg">
          <button data-mode="pvp" class="active">2 Players</button>
          <button data-mode="ai">vs Computer</button>
        </div>

        <select id="difficulty" title="Computer difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>

        <button id="resetScores" style="flex:1 1 100%">Reset Scores</button>
      </div>

      <div class="scoreboard">
        <div class="score x"><div class="label">X Wins</div><div class="value" id="scoreX">0</div></div>
        <div class="score o"><div class="label">O Wins</div><div class="value" id="scoreO">0</div></div>
        <div class="score d"><div class="label">Draws</div><div class="value" id="scoreD">0</div></div>
      </div>

      <p class="hint">You are <strong style="color:var(--x)">X</strong>. Click any square to play.</p>
    </div>

    <p class="credit">🎮 Designed by <strong>Ashutosh Yadav</strong></p>
  </div>

<script>
(() => {
  "use strict";

  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const modeSeg = document.getElementById("modeSeg");
  const difficultyEl = document.getElementById("difficulty");
  const newGameBtn = document.getElementById("newGame");
  const resetScoresBtn = document.getElementById("resetScores");
  const scoreEls = {
    X: document.getElementById("scoreX"),
    O: document.getElementById("scoreO"),
    D: document.getElementById("scoreD")
  };

  let board = Array(9).fill(null);
  let current = "X";
  let gameOver = false;
  let mode = "pvp";           // "pvp" | "ai"
  let difficulty = "medium";  // "easy" | "medium" | "hard"
  let scores = { X: 0, O: 0, D: 0 };
  let locked = false;         // true while the computer is thinking

  /* ---------------- board rendering ---------------- */

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const btn = document.createElement("button");
    btn.className = "cell";
    btn.type = "button";
    btn.setAttribute("role", "gridcell");
    btn.dataset.index = String(i);
    btn.setAttribute("aria-label", `Row ${Math.floor(i / 3) + 1} column ${(i % 3) + 1}, empty`);
    btn.addEventListener("click", () => handleClick(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }

  function render() {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      const mark = board[i];
      cell.textContent = mark || "";
      cell.className = "cell" + (mark ? " " + mark.toLowerCase() + " taken" : "");
      cell.setAttribute("aria-label", mark
        ? `Row ${Math.floor(i / 3) + 1} column ${(i % 3) + 1}, ${mark}`
        : `Row ${Math.floor(i / 3) + 1} column ${(i % 3) + 1}, empty`);
    }
  }

  function setStatus(html) {
    statusEl.innerHTML = html;
  }

  function markSpan(mark) {
    return `<span class="mark ${mark.toLowerCase()}">${mark}</span>`;
  }

  /* ---------------- game logic ---------------- */

  function findWinner(state) {
    for (const [a, b, c] of WIN_LINES) {
      if (state[a] && state[a] === state[b] && state[a] === state[c]) {
        return { mark: state[a], line: [a, b, c] };
      }
    }
    return null;
  }

  function play(i) {
    if (gameOver || locked || board[i]) return;

    board[i] = current;
    cells[i].textContent = current;
    cells[i].classList.add("taken");
    cells[i].classList.add(current.toLowerCase());

    const winner = findWinner(board);

    if (winner) {
      gameOver = true;
      highlight(winner.line);
      scores[winner.mark]++;
      updateScores();
      setStatus(`${markSpan(winner.mark)} wins!`);
      lockBoard();
      return;
    }

    if (board.every(Boolean)) {
      gameOver = true;
      scores.D++;
      updateScores();
      setStatus(`It's a draw.`);
      lockBoard();
      return;
    }

    current = current === "X" ? "O" : "X";
    setStatus(`${markSpan(current)}'s turn`);

    if (mode === "ai" && current === "O") {
      locked = true;
      setTimeout(computerMove, 350);
    }
  }

  function highlight(line) {
    line.forEach(i => cells[i].classList.add("win"));
  }

  function lockBoard() {
    cells.forEach(c => { c.disabled = true; });
  }

  function unlockBoard() {
    cells.forEach(c => { c.disabled = false; });
  }

  function handleClick(i) {
    if (mode === "ai" && current === "O") return; // human always plays X
    play(i);
  }

  function updateScores() {
    scoreEls.X.textContent = scores.X;
    scoreEls.O.textContent = scores.O;
    scoreEls.D.textContent = scores.D;
  }

  function newGame() {
    board = Array(9).fill(null);
    current = "X";
    gameOver = false;
    locked = false;
    render();
    unlockBoard();
    setStatus(`${markSpan("X")}'s turn`);
    if (mode === "ai" && current === "O") {
      locked = true;
      setTimeout(computerMove, 350);
    }
  }

  /* ---------------- computer (minimax) ---------------- */

  const DEPTH_LIMITS = { easy: 1, medium: 3, hard: 9 };

  function computerMove() {
    let best = null;

    if (difficulty === "easy" && Math.random() < 0.45) {
      // Easy: sometimes play a random open square instead of the best one.
      const open = board.map((m, i) => (m ? null : i)).filter(i => i !== null);
      best = open[Math.floor(Math.random() * open.length)] ?? null;
    }

    if (best == null) {
      best = findBestMove(board, "O", DEPTH_LIMITS[difficulty]);
    }

    // Unlock before playing: play() refuses input while locked.
    locked = false;
    if (best != null) play(best);
  }

  // Returns the index of the best move for `player`, or null if the board is full.
  // Scores are evaluated from O's point of view (higher = better for the computer).
  function findBestMove(state, player, depth) {
    let bestValue = -Infinity;
    let bestMove = null;

    for (let i = 0; i < 9; i++) {
      if (state[i]) continue;
      state[i] = player;
      const value = minimax(state, player === "O" ? "X" : "O", depth - 1);
      state[i] = null;
      if (value > bestValue) {
        bestValue = value;
        bestMove = i;
      }
    }
    return bestMove;
  }

  // Standard minimax. `player` is whoever moves next.
  // Positive scores favor O, negative scores favor X (O is the computer).
  function minimax(state, player, depth) {
    const winner = findWinner(state);
    if (winner) {
      const ply = state.filter(Boolean).length; // moves made so far
      return winner.mark === "O" ? 10 - ply : ply - 10;
    }
    if (state.every(Boolean)) return 0;
    if (depth <= 0) return heuristic(state, "O");

    let maximizing = player === "O";
    let best = maximizing ? -Infinity : Infinity;

    for (let i = 0; i < 9; i++) {
      if (state[i]) continue;
      state[i] = player;
      const value = minimax(state, player === "O" ? "X" : "O", depth - 1);
      state[i] = null;
      best = maximizing ? Math.max(best, value) : Math.min(best, value);
    }
    return best;
  }

  // Score the board from the point of view of `player` using simple line counting.
  function heuristic(state, player) {
    const opponent = player === "O" ? "X" : "O";
    let score = 0;
    for (const [a, b, c] of WIN_LINES) {
      const marks = [state[a], state[b], state[c]];
      const mine = marks.filter(m => m === player).length;
      const theirs = marks.filter(m => m === opponent).length;
      if (mine === 3) score += 100;
      else if (mine === 2 && theirs === 0) score += 10;
      else if (theirs === 2 && mine === 0) score -= 10;
    }
    return score;
  }

  /* ---------------- controls ---------------- */

  modeSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    mode = btn.dataset.mode;
    [...modeSeg.children].forEach(b => b.classList.toggle("active", b === btn));
    newGame();
  });

  difficultyEl.addEventListener("change", () => {
    difficulty = difficultyEl.value;
  });

  newGameBtn.addEventListener("click", newGame);

  resetScoresBtn.addEventListener("click", () => {
    scores = { X: 0, O: 0, D: 0 };
    updateScores();
  });

  // Keyboard support: 1-9 map to the board cells.
  document.addEventListener("keydown", (e) => {
    if (e.key >= "1" && e.key <= "9") {
      const idx = Number(e.key) - 1;
      if (!cells[idx].disabled) handleClick(idx);
    }
    if (e.key.toLowerCase() === "r") newGame();
  });

  newGame();
})();
</script>
</body>
</html>
